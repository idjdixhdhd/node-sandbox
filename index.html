<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Node 前端沙箱</title>
    <style>
      body {
        font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background: #0f1115;
        color: #e6e6e6;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .card {
        text-align: center;
        padding: 48px;
        border-radius: 16px;
        background: #1a1d24;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }
      h1 {
        font-size: 28px;
        margin: 0 0 8px;
        background: linear-gradient(90deg, #f0c040, #ff8a5c);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        color: #9aa0aa;
        margin: 4px 0;
      }
      code {
        background: #262b35;
        padding: 2px 8px;
        border-radius: 6px;
        color: #f0c040;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Node 前端沙箱已就绪</h1>
      <p>Node 22 · Vite · Prettier · ESLint · Continue</p>
      <p>运行 <code>npm run dev</code> 启动开发服务器</p>
    </div>
  </body>
</html>
